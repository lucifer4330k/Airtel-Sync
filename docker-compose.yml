name: udyam-digital

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: udyam
      POSTGRES_PASSWORD: udyam
      POSTGRES_DB: udyam
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udyam"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # S3-compatible object store for KYC documents (files arrive already
  # encrypted by the API). Dev credentials live in infra/seaweedfs/s3.json.
  objectstore:
    image: chrislusf/seaweedfs:3.80
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333"]
    volumes:
      - objectdata:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://udyam:udyam@postgres:5432/udyam
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://objectstore:8333
      STORAGE_BACKEND: s3
      KYC_QUEUE: rq
      PUBLIC_WEB_URL: http://localhost:3000
      SEED_ON_START: "true"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      objectstore: { condition: service_started }

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: rq worker --url redis://redis:6379/0 kyc notifications maintenance
    # the API container runs migrations, seeding and the nightly purge
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://udyam:udyam@postgres:5432/udyam
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://objectstore:8333
      STORAGE_BACKEND: s3
      KYC_QUEUE: rq
      PUBLIC_WEB_URL: http://localhost:3000
    depends_on: [api]

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  objectdata:
