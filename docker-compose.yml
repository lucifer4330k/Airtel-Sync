name: udyam-digital

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: udyam
      POSTGRES_PASSWORD: udyam
      POSTGRES_DB: udyam
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udyam"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-udyamminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-udyamminio-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://udyam:udyam@postgres:5432/udyam
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      DATA_DIR: /data
    volumes: ["./data:/data:ro"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./apps/api
    command: rq worker --url redis://redis:6379/0 kyc notifications maintenance
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://udyam:udyam@postgres:5432/udyam
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      DATA_DIR: /data
    volumes: ["./data:/data:ro"]
    depends_on: [api]

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
