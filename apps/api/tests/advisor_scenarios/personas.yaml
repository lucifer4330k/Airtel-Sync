# Advisor personas. Each runs through the real API: opening message, then the
# answer for whatever the advisor asks next (by slot). Checks:
#   include:      products that must be in the recommended plan
#   never:        products that must not appear in ANY tier (ineligible or unwanted)
#   segment:      segment the advisor should settle on
#   needs_human:  whether a specialist follow-up should be flagged
#   note:         text that must appear in the reply (e.g. the nearest alternative)
# Every scenario is also re-validated: no tier may hold an ineligible product.

