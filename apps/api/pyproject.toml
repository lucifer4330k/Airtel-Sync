[project]
name = "udyam-api"
version = "0.1.0"
description = "Udyam Digital backend: advisor, quote, Smart KYC, order tracker, partner console"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "cryptography>=43",
    "redis>=5.2",
    "rq>=2.0",
    "rapidfuzz>=3.10",
    "python-multipart>=0.0.17",
    "httpx>=0.28",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    "boto3>=1.43.126",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-openai>=0.3",
    "rapidocr-onnxruntime>=1.4",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
ml = [
    "lightgbm>=4.5",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # third-party deprecations we can't fix from here
    "ignore::DeprecationWarning:langsmith.*",
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
    "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff.lint.per-file-ignores]
# user-facing copy: long natural-language strings
"app/services/advisor/replies.py" = ["E501"]
"app/services/advisor/explain.py" = ["E501"]
"app/services/advisor/llm.py" = ["E501"]
"app/services/kyc/validators.py" = ["E501"]
"app/services/repair.py" = ["E501"]
